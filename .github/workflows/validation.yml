name: "Phone & Ads Validation"

# Separate from Schema Monitor — validates Kuwait phone + listing ID formats
# against CFl_data shapes in R2 Excel exports.

on:
  schedule:
    # After typical daily scrape window (09:30 UTC Mon–Sat)
    - cron: "30 9 * * 1-6"

  workflow_run:
    workflows:
      - "Schema Monitor"
    types:
      - completed

  workflow_dispatch:
    inputs:
      date:
        description: "Listing date to validate (YYYY-MM-DD). Leave blank for yesterday."
        required: false
        default: ""
      days_lookback:
        description: "How many listing days to scan (1 = single date)"
        required: false
        default: "1"
      max_invalid_phone_pct:
        description: "Fail a scraper when invalid phones exceed this %"
        required: false
        default: "15"
      max_invalid_ads_pct:
        description: "Fail a scraper when invalid ad IDs exceed this %"
        required: false
        default: "15"
      fail_on_error:
        description: "Fail the workflow if any scraper exceeds thresholds?"
        type: boolean
        default: false

concurrency:
  group: phone-ads-validation
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  validate-phones-ads:
    name: "Validate phone & ads numbers"
    runs-on: ubuntu-22.04
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')

    env:
      CF_R2_ACCESS_KEY_ID:       ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY:   ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      CF_R2_ENDPOINT_URL:        ${{ secrets.CF_R2_ENDPOINT_URL }}
      CF_R2_BUCKET_NAME:         ${{ secrets.CF_R2_BUCKET_NAME }}
      MONITOR_SITE_SLUG:         4sale
      MONITOR_ALERT_WEBHOOK_URL: ${{ secrets.MONITOR_ALERT_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: CFl_data/requirements.txt

      - name: Install dependencies
        run: pip install -r CFl_data/requirements.txt pyyaml

      - name: Build validation flags
        id: flags
        run: |
          FLAGS=""

          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            FLAGS="$FLAGS --date $DATE"
          fi

          LOOKBACK="${{ github.event.inputs.days_lookback }}"
          if [ -n "$LOOKBACK" ] && [ "$LOOKBACK" != "1" ]; then
            FLAGS="$FLAGS --days-lookback $LOOKBACK"
          fi

          PHONE_PCT="${{ github.event.inputs.max_invalid_phone_pct }}"
          if [ -n "$PHONE_PCT" ]; then
            FLAGS="$FLAGS --max-invalid-phone-pct $PHONE_PCT"
          fi

          ADS_PCT="${{ github.event.inputs.max_invalid_ads_pct }}"
          if [ -n "$ADS_PCT" ]; then
            FLAGS="$FLAGS --max-invalid-ads-pct $ADS_PCT"
          fi

          if [ "${{ github.event.inputs.fail_on_error }}" = "true" ]; then
            FLAGS="$FLAGS --fail-on-error"
          fi

          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "Validation flags: $FLAGS"

      - name: Run phone & ads validation
        run: python validation/validate_phones.py ${{ steps.flags.outputs.flags }}
